# =============================================================================
# grub.cfg - GRUB2 Boot Menu for Nexy OS
# =============================================================================

# Set timeout (seconds before auto-booting the first entry)
set timeout=5
set default=0

# Enable graphical menu (requires theme or just uses text mode)
# To enable a custom theme, place it in /boot/grub/themes/ inside the ISO

# ---- Menu entry ------------------------------------------------------------
menuentry "Nexy OS v0.1.0 (Graphical - 1024x768x32)" {
    insmod all_video
    insmod vbe
    insmod vga

    # Load our multiboot2 kernel
    multiboot2 /boot/nexy.elf

    # Boot it
    boot
}

menuentry "Nexy OS v0.1.0 (VGA Text Fallback)" {
    insmod vga

    # Load kernel without requesting a framebuffer
    # (GRUB won't set a VBE mode, kernel falls back to text mode)
    multiboot2 /boot/nexy.elf vga_fallback

    boot
}

menuentry "Reboot" {
    reboot
}

menuentry "Power Off" {
    halt
}
